name: GitHub To GitLab Trigger

on:
  push:
    branches:
      - dev
      - 'feature/*'
    tags:
      - 'v*'

  pull_request:
    branches:
      - dev
    types:
      - opened
      - synchronize
      - reopened
      - closed

jobs:

  trigger-gitlab:
    runs-on: ubuntu-latest

    steps:

      - name: Prepare Variables
        run: |
          echo "GH_EVENT=${{ github.event_name }}" >> $GITHUB_ENV
          echo "GH_REF=${{ github.ref }}" >> $GITHUB_ENV
          echo "GH_REF_NAME=${{ github.ref_name }}" >> $GITHUB_ENV
          echo "GH_SHA=${{ github.sha }}" >> $GITHUB_ENV
          echo "GH_ACTOR=${{ github.actor }}" >> $GITHUB_ENV

          echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_ENV
          echo "PR_MERGED=${{ github.event.pull_request.merged }}" >> $GITHUB_ENV
          echo "PR_BASE=${{ github.event.pull_request.base.ref }}" >> $GITHUB_ENV
          echo "PR_HEAD=${{ github.event.pull_request.head.ref }}" >> $GITHUB_ENV

      - name: Debug Variables
        run: |
          echo "========== GitHub Variables =========="
          echo "GH_EVENT=$GH_EVENT"
          echo "GH_REF=$GH_REF"
          echo "GH_REF_NAME=$GH_REF_NAME"
          echo "GH_SHA=$GH_SHA"
          echo "GH_ACTOR=$GH_ACTOR"
          echo "PR_NUMBER=$PR_NUMBER"
          echo "PR_MERGED=$PR_MERGED"
          echo "PR_BASE=$PR_BASE"
          echo "PR_HEAD=$PR_HEAD"
          echo "======================================"

      - name: Debug GitLab Config
        run: |
          echo "GITLAB_URL=${{ secrets.GITLAB_URL }}"
          echo "GITLAB_PROJECT_ID=${{ secrets.GITLAB_PROJECT_ID }}"

      - name: Trigger GitLab Pipeline
        run: |
          curl --fail --retry 3 --retry-delay 2 -X POST \
            -F token=${{ secrets.GITLAB_TRIGGER_TOKEN }} \
            -F ref=main \
            -F "variables[GH_EVENT]=$GH_EVENT" \
            -F "variables[GH_REF]=$GH_REF" \
            -F "variables[GH_REF_NAME]=$GH_REF_NAME" \
            -F "variables[GH_SHA]=$GH_SHA" \
            -F "variables[GH_ACTOR]=$GH_ACTOR" \
            -F "variables[PR_NUMBER]=$PR_NUMBER" \
            -F "variables[PR_MERGED]=$PR_MERGED" \
            -F "variables[PR_BASE]=$PR_BASE" \
            -F "variables[PR_HEAD]=$PR_HEAD" \
            "${{ secrets.GITLAB_URL }}/api/v4/projects/${{ secrets.GITLAB_PROJECT_ID }}/trigger/pipeline"
