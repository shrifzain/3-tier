name: Trigger GitLab Pipeline

on:
  push:
    branches:
      - master
      - dev
      - 'feature/**'
      - 'hotfix/**'
    tags:
      - 'v*'

  pull_request:
    types: [opened, synchronize, reopened, closed]

  release:
    types: [published]

concurrency:
  group: trigger-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Determine event metadata
        shell: bash
        run: |
          {
            echo "GH_EVENT=${{ github.event_name }}"
            echo "GH_REF=${{ github.ref }}"
            echo "GH_REF_NAME=${{ github.ref_name }}"
            echo "GH_SHA=${{ github.sha }}"
            echo "GH_ACTOR=${{ github.actor }}"
          } >> "$GITHUB_ENV"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            {
              echo "PR_NUMBER=${{ github.event.pull_request.number }}"
              echo "PR_MERGED=${{ github.event.pull_request.merged }}"
              echo "PR_BASE=${{ github.event.pull_request.base.ref }}"
              echo "PR_HEAD=${{ github.event.pull_request.head.ref }}"
            } >> "$GITHUB_ENV"
          fi

      - name: Trigger GitLab
        shell: bash
        run: |
          curl --fail --retry 3 --retry-delay 2 -X POST \
            -F token=${{ secrets.GITLAB_TRIGGER_TOKEN }} \
            -F ref=main \
            -F "variables[GH_EVENT]=$GH_EVENT" \
            -F "variables[GH_REF]=$GH_REF" \
            -F "variables[GH_REF_NAME]=$GH_REF_NAME" \
            -F "variables[GH_SHA]=$GH_SHA" \
            -F "variables[GH_ACTOR]=$GH_ACTOR" \
            -F "variables[PR_NUMBER]=$PR_NUMBER" \
            -F "variables[PR_MERGED]=$PR_MERGED" \
            -F "variables[PR_BASE]=$PR_BASE" \
            -F "variables[PR_HEAD]=$PR_HEAD" \
            "${{ secrets.GITLAB_URL }}/api/v4/projects/${{ secrets.GITLAB_PROJECT_ID }}/trigger/pipeline"
