name: Trigger GitLab Pipeline

# This file is a template. Commit it into the GitHub repository that owns
# the source code (WideBot/WideRAG). GitHub Actions only fire from workflows
# present in the same repo where the push happens.
#
# Required GitHub secrets:
#   GITLAB_URL            e.g. https://gitlab.example.com (no trailing slash)
#   GITLAB_PROJECT_ID     numeric project ID shown under the GitLab project title
#   GITLAB_TRIGGER_TOKEN  GitLab → Settings → CI/CD → Pipeline triggers → token
#
# Filters applied (mirror of /home/shrief/new-rag-pipline/.pipeline-flags.yml):
#   - paths-ignore  → skip docs-only / .github-only / LICENSE / *.txt commits
#   - job if:       → skip bot commits (dependabot, github-actions, renovate, merge-queue)
#                  → skip draft PR events (only relevant when pull_request: is enabled)
# pull_request, release, and feature/hotfix push events are not triggered;
# add them back when you have PR-validation logic in the GitLab pipeline.

on:
  push:
    branches:
      - master
      - main
      - dev
      - develop
    tags:
      - 'v*'
    paths-ignore:
      - '**/*.md'
      - '**/docs/**'
      - '.gitignore'
      - 'LICENSE'
      - '.github/**'
      - '*.txt'

concurrency:
  group: trigger-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    # Skip the trigger job for bot actors and for draft PRs.
    # `paths-ignore` above already handles docs-only / ignore-path filtering.
    if: |
      !contains(fromJSON('["dependabot[bot]","github-actions[bot]","renovate[bot]","github-merge-queue[bot]"]'), github.actor)
      && (github.event_name != 'pull_request' || github.event.pull_request.draft != true)

    steps:
      - name: Determine event metadata
        shell: bash
        run: |
          # Push-event commit author + message (first line only; multi-line
          # subjects break Slack's JSON-on-one-line payload).
          AUTHOR='${{ github.event.head_commit.author.name }}'
          MSG=$(printf '%s' '${{ github.event.head_commit.message }}' | head -n1)

          {
            echo "GH_EVENT=${{ github.event_name }}"
            echo "GH_REF=${{ github.ref }}"
            echo "GH_REF_NAME=${{ github.ref_name }}"
            echo "GH_SHA=${{ github.sha }}"
            echo "GH_ACTOR=${{ github.actor }}"
            echo "GH_AUTHOR=$AUTHOR"
            echo "GH_COMMIT_MESSAGE=$MSG"
          } >> "$GITHUB_ENV"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            {
              echo "PR_NUMBER=${{ github.event.pull_request.number }}"
              echo "PR_MERGED=${{ github.event.pull_request.merged }}"
              echo "PR_BASE=${{ github.event.pull_request.base.ref }}"
              echo "PR_HEAD=${{ github.event.pull_request.head.ref }}"
            } >> "$GITHUB_ENV"
          fi

      - name: Trigger GitLab
        shell: bash
        run: |
          # Capture HTTP code AND response body so 4xx errors from GitLab
          # are visible in the log (the previous --fail dropped the body).
          set +e
          HTTP_CODE=$(curl --silent --retry 3 --retry-delay 2 \
            --output /tmp/gitlab-response.json \
            --write-out '%{http_code}' \
            -X POST \
            -F token=${{ secrets.GITLAB_TRIGGER_TOKEN }} \
            -F ref=main \
            -F "variables[GH_EVENT]=$GH_EVENT" \
            -F "variables[GH_REF]=$GH_REF" \
            -F "variables[GH_REF_NAME]=$GH_REF_NAME" \
            -F "variables[GH_SHA]=$GH_SHA" \
            -F "variables[GH_ACTOR]=$GH_ACTOR" \
            -F "variables[GH_AUTHOR]=$GH_AUTHOR" \
            -F "variables[GH_COMMIT_MESSAGE]=$GH_COMMIT_MESSAGE" \
            -F "variables[PR_NUMBER]=$PR_NUMBER" \
            -F "variables[PR_MERGED]=$PR_MERGED" \
            -F "variables[PR_BASE]=$PR_BASE" \
            -F "variables[PR_HEAD]=$PR_HEAD" \
            "${{ secrets.GITLAB_URL }}/api/v4/projects/${{ secrets.GITLAB_PROJECT_ID }}/trigger/pipeline")
          echo "HTTP $HTTP_CODE"
          echo "Response body:"
          cat /tmp/gitlab-response.json
          echo
          if [ "$HTTP_CODE" != "201" ]; then
            exit 1
          fi
