name: Trigger GitLab Pipeline

# This file is a template. Commit it into the GitHub repository that owns
# the source code (WideBot/WideRAG). GitHub Actions only fire from workflows
# present in the same repo where the push happens.
#
# Required GitHub secrets:
#   GITLAB_URL            e.g. https://gitlab.example.com (no trailing slash)
#   GITLAB_PROJECT_ID     numeric project ID shown under the GitLab project title
#   GITLAB_TRIGGER_TOKEN  GitLab → Settings → CI/CD → Pipeline triggers → token

on:
  push:
    branches:
      - master
      - main
      - dev
      - develop
    tags:
      - 'v*'

  # NOTE: pull_request, release, and feature/hotfix push events are
  # intentionally NOT triggered. There is no test or PR-validation logic
  # in the GitLab pipeline yet, so running build+test on those would
  # consume CI minutes for no gain. Re-add them once tests exist.

concurrency:
  group: trigger-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Determine event metadata
        shell: bash
        run: |
          {
            echo "GH_EVENT=${{ github.event_name }}"
            echo "GH_REF=${{ github.ref }}"
            echo "GH_REF_NAME=${{ github.ref_name }}"
            echo "GH_SHA=${{ github.sha }}"
            echo "GH_ACTOR=${{ github.actor }}"
          } >> "$GITHUB_ENV"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            {
              echo "PR_NUMBER=${{ github.event.pull_request.number }}"
              echo "PR_MERGED=${{ github.event.pull_request.merged }}"
              echo "PR_BASE=${{ github.event.pull_request.base.ref }}"
              echo "PR_HEAD=${{ github.event.pull_request.head.ref }}"
            } >> "$GITHUB_ENV"
          fi

      - name: Trigger GitLab
        shell: bash
        run: |
          # Capture HTTP code AND response body so 4xx errors from GitLab
          # are visible in the log (the previous --fail dropped the body).
          set +e
          HTTP_CODE=$(curl --silent --retry 3 --retry-delay 2 \
            --output /tmp/gitlab-response.json \
            --write-out '%{http_code}' \
            -X POST \
            -F token=${{ secrets.GITLAB_TRIGGER_TOKEN }} \
            -F ref=main \
            -F "variables[GH_EVENT]=$GH_EVENT" \
            -F "variables[GH_REF]=$GH_REF" \
            -F "variables[GH_REF_NAME]=$GH_REF_NAME" \
            -F "variables[GH_SHA]=$GH_SHA" \
            -F "variables[GH_ACTOR]=$GH_ACTOR" \
            -F "variables[PR_NUMBER]=$PR_NUMBER" \
            -F "variables[PR_MERGED]=$PR_MERGED" \
            -F "variables[PR_BASE]=$PR_BASE" \
            -F "variables[PR_HEAD]=$PR_HEAD" \
            "${{ secrets.GITLAB_URL }}/api/v4/projects/${{ secrets.GITLAB_PROJECT_ID }}/trigger/pipeline")
          echo "HTTP $HTTP_CODE"
          echo "Response body:"
          cat /tmp/gitlab-response.json
          echo
          if [ "$HTTP_CODE" != "201" ]; then
            exit 1
          fi
